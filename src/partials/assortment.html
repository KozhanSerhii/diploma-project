<section class="assortment-section" id="assortment-section">
  <div class="container">
    <h2 class="assortment-title">Наші сумки</h2>
    <p class="assortment-subtitle">
      Знайдіть ідеальне рішення для вашого комфорту.
    </p>

    <div class="assortment-filters" aria-label="Фільтри товарів">
      <button
        class="assortment-filter-btn is-active"
        type="button"
        data-filter="all"
      >
        <span class="assortment-filter-icon" aria-hidden="true">👕</span>
        Всі товари
      </button>

      <button class="assortment-filter-btn" type="button" data-filter="adults">
        <span class="assortment-filter-icon" aria-hidden="true">👤</span>
        Для дорослих
      </button>

      <button class="assortment-filter-btn" type="button" data-filter="travel">
        <span class="assortment-filter-icon" aria-hidden="true">🧳</span>
        Для подорожей
      </button>

      <button class="assortment-filter-btn" type="button" data-filter="everyday">
        <span class="assortment-filter-icon" aria-hidden="true">☀️</span>
        Повсякденні
      </button>

      <button class="assortment-filter-btn" type="button" data-filter="backpacks">
        <span class="assortment-filter-icon" aria-hidden="true">🎒</span>
        Рюкзаки
      </button>

      <button class="assortment-filter-btn" type="button" data-filter="shoppers">
        <span class="assortment-filter-icon" aria-hidden="true">🛍️</span>
        Шопери
      </button>
    </div>

    <ul class="assortment-list"></ul>

    <div class="assortment-load-more-wrap">
      <button class="assortment-load-more-btn" type="button">
        Показати ще
      </button>
    </div>
  </div>
</section>
